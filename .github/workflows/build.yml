name: build-app

on:
  push:

jobs:
  validations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'
          cache: yarn
      - name: install
        run: yarn install --frozen-lockfile
      - name: lint
        run: yarn lint:check

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: db
          POSTGRES_PASSWORD: pass1234
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'
          cache: yarn
      - name: install
        run: yarn install --frozen-lockfile
      - name: create .env
        run: |
          echo "PG_COMPONENT_PSQL_CONNECTION_STRING=postgresql://usr:pwd@localhost:5432/exploration_games" >> .env
          echo "ADMINS=0x7949f9f239d1a0816ce5eb364a1f588ae9cc1bf5" >> .env
      - name: build
        run: yarn build
      - name: test
        run: yarn test
        env:
          PG_COMPONENT_PSQL_CONNECTION_STRING: postgres://postgres:pass1234@localhost/db
