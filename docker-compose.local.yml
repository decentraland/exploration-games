version: '3.8'
services:
  postgres:
    container_name: 'exploration_games_db'
    image: 'postgres:latest'
    restart: always
    user: postgres
    volumes:
      - postgres_volume:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=exploration_games
    ports:
      - '5432:5432'
volumes:
  postgres_volume:
